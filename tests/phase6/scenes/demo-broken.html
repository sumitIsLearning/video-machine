<style>
  .demo-frame { position: absolute; inset: 0; overflow: hidden; background: #FDFBF9; }
  .demo-card { position: absolute; left: 0; top: 40%; width: 100%; height: 20%; background: #FF4D00; }
  .demo-small { position: absolute; left: 10%; top: 1800px; font-family: Inter, sans-serif; font-size: 30px; color: #111111; }
  .demo-drift { position: absolute; left: 0; bottom: 0; width: 30%; height: 4%; background: #111111; }
</style>
<div class="demo-frame">
  <div class="demo-card"></div>
  <div class="demo-small">It reads the page the way you would.</div>
  <div class="demo-drift"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines["demo"] = tl;
  const s = VM.scene("demo");
  // The drift stops for half a second around the "reads" beat: no visual change on the beat.
  const beat = s.at("reads");
  tl.fromTo(".demo-drift", { xPercent: -100 }, { xPercent: -50, duration: beat - 0.25, ease: "none" }, 0);
  tl.fromTo(".demo-drift", { xPercent: -50 }, { xPercent: 300, duration: s.duration - beat - 0.25, ease: "none" }, beat + 0.25);
</script>
