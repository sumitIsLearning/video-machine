<style>
  .demo-frame { position: absolute; inset: 0; overflow: hidden; background: #FDFBF9; }
  .demo-card { position: absolute; left: 0; top: 40%; width: 100%; height: 20%; background: #FF4D00; }
  .demo-text {
    position: absolute;
    left: var(--vm-safe-left);
    top: var(--vm-safe-top);
    width: calc(var(--vm-w) - var(--vm-safe-left) - var(--vm-safe-right));
    height: calc(var(--vm-h) * 0.3);
    color: #111111;
    font-family: Inter, sans-serif;
    font-weight: 700;
    line-height: 1.05;
  }
  .demo-drift { position: absolute; left: 0; bottom: 0; width: 30%; height: 4%; background: #111111; }
</style>
<div class="demo-frame">
  <div class="demo-card"></div>
  <div class="demo-text">It reads the page the way you would.</div>
  <div class="demo-drift"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines["demo"] = tl;
  const s = VM.scene("demo");
  s.fit(document.querySelector(".demo-text"));
  tl.fromTo(".demo-drift", { xPercent: -100 }, { xPercent: 300, duration: s.duration, ease: "none" }, 0);
  tl.fromTo(".demo-card", { xPercent: -100 }, { xPercent: 0, duration: 0.5, ease: "power3.out" }, s.at("reads"));
</script>
