[project]
name = "video-machine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
extend-exclude = ["lib/adapters/align/ctc-onnx/analysis", "tests/fixture", "runs"]  # vendored aligner scripts stay as lifted

[tool.ruff.lint.per-file-ignores]
# audio_vo.py is a flat script: align.py runs its patched source on purpose (see the ponytail note there)
"lib/adapters/align/ctc-onnx/align.py" = ["S102"]
